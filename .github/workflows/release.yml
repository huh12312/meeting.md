name: Release

# Pushing a tag such as v1.2.3:
#   - tests the server, builds its image and publishes it to Docker Hub as
#     <DOCKERHUB_USERNAME>/meeting.md:1.2.3, :1.2 and :latest
#   - tests the desktop app, builds the Linux AppImage and attaches it to a
#     GitHub release for the tag
#
# macOS and Windows installers are not built here on purpose: they would bundle
# VideoDB's proprietary capture binary, which may not be redistributed.
#
# Repository settings needed once:
#   variable DOCKERHUB_USERNAME   Docker Hub user or organisation
#   secret   DOCKERHUB_TOKEN      Docker Hub access token with write access

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret in the repository settings."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/meeting.md
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Pre-release tags (v1.2.3-rc.1) are published but do not move :latest.
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Also copies ../capture-linux into the slot the videodb SDK looks in.
      - run: npm ci

      - name: Use the tag as the app version
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - run: npm run typecheck
      - run: npm test

      - name: Build the AppImage
        run: npm run dist:linux -- --publish never

      - name: Attach it to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.AppImage --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.AppImage \
              --title "meeting.md ${GITHUB_REF_NAME#v}" --generate-notes
          fi
